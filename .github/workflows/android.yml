name: Export and Build Android APK

on:
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (preinstalled on the runner)
        run: |
          CT="$ANDROID_HOME/cmdline-tools"
          ls "$ANDROID_HOME"
          ls "$CT"
          if [ ! -e "$CT/latest" ]; then
            FIRST=$(ls "$CT" | head -1)
            sudo ln -s "$CT/$FIRST" "$CT/latest"
          fi
          yes | "$CT/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$CT/latest/bin/sdkmanager" "platform-tools" "build-tools;34.0.0" "platforms;android-34" || true

      - name: Download Godot and export templates
        run: |
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          curl -sL -o tpz.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q tpz.zip -d tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv tpz/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Debug keystore and editor settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/debug_keystore = \"$GITHUB_WORKSPACE/debug.keystore\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > "$HOME/.config/godot/editor_settings-4.tres"

      - name: Import Godot assets
        run: ./godot --headless --import || true

      - name: Export APK
        run: |
          mkdir -p build/android
          ./godot --headless --export-debug "Android" build/android/game.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/game.apk
